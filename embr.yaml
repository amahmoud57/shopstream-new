platform: nodejs
platformVersion: "20"
autoDeploy: true

run:
  port: 3000
  startCommand: node server/index.js

database:
  sync: "echo 'INTENTIONAL FAILURE' && exit 1"
  seed: "psql $DATABASE_URL -f db/seed.sql"

dependencies:
  db:
    type: postgres
    required: true
    description: Primary application database
    provides:
      - name: DATABASE_URL
        secret: true
        scope: all

static:
  spaFallback: true

healthCheck:
  path: /health
